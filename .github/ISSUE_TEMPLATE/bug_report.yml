name: Bug report
description: Something doesn't work when connecting to or using the MAQAMI Travel MCP server.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't include real guest names, emails, payment details or booking IDs.
  - type: dropdown
    id: connection
    attributes:
      label: How do you connect?
      options:
        - Remote endpoint (https://mcp.maqami.co/)
        - npm stdio bridge (npx maqami-travel)
        - Gemini CLI extension
        - Claude Code plugin
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: "e.g. Claude Code, Cursor or VS Code, with the version number"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the tool name and the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect with ...
        2. Ask "..."
        3. See error ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove any personal data before pasting.
      render: text
